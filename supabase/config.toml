# Supabase CLI project config for LushDate. Only non-default settings are listed.
project_id = "lushdate"

[auth]
site_url = "lushdate://"
additional_redirect_urls = ["lushdate://*"]

[auth.sms]
enable_signup = true
enable_confirmations = true
# Local development only: sign in with this phone number and code, no SMS sent.
[auth.sms.test_otp]
15555550100 = "123456"

# These endpoints are called by webhooks/cron/RevenueCat and check a shared
# secret themselves instead of a user JWT.
[functions.purge-snaps]
verify_jwt = false

[functions.push]
verify_jwt = false

[functions.moderate-photo]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.check-photo]
verify_jwt = true

[functions.call-token]
verify_jwt = true

[functions.report-location]
verify_jwt = true

[functions.date-deposit]
verify_jwt = true

[functions.date-check-in]
verify_jwt = true

[functions.kyc-start]
verify_jwt = true

[functions.panic]
verify_jwt = true

# Called by Stripe, Persona and the scheduler; they check signatures/secrets.
[functions.payments]
verify_jwt = true

[functions.paystack-webhook]
verify_jwt = false

[functions.paystack-return]
verify_jwt = false

[functions.kyc-webhook]
verify_jwt = false

[functions.settle-dates]
verify_jwt = false
